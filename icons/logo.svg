<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Retro Arcade Outer Border -->
  <rect x="1" y="1" width="30" height="30" fill="#0c0d10" stroke="#000" stroke-width="1"/>
  <!-- Floppy Body -->
  <rect x="4" y="7" width="24" height="21" fill="#2d323f"/>
  <rect x="4" y="7" width="24" height="2" fill="#42495b"/>
  <!-- Silver Shutter -->
  <rect x="8" y="7" width="14" height="8" fill="#c0c7d6"/>
  <rect x="11" y="9" width="4" height="4" fill="#121418"/>
  <!-- Label -->
  <rect x="7" y="17" width="18" height="9" fill="#f4f4f0"/>
  <rect x="9" y="19" width="14" height="2" fill="#00ff66"/>
  <rect x="9" y="22" width="10" height="2" fill="#ffaa00"/>
  <!-- Glowing Chiptune Web Tabs Header -->
  <rect x="4" y="3" width="7" height="3" fill="#00ff66"/>
  <rect x="12" y="3" width="7" height="3" fill="#ffaa00"/>
  <rect x="20" y="3" width="7" height="3" fill="#ff0055"/>
</svg>
